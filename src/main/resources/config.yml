# Elementalist: a Garrison guard that wields one of four elements.
#
# Setup: put Elementalist.jar in plugins/Garrison/addons/, then add a guard type that uses it
# to plugins/Garrison/garrison.yml (see the README for a ready-made one):
#
#   types:
#     elementalist:
#       entity: HUSK
#       behaviour: elementalist
#       gear-slots: [HEAD, CHEST, LEGS, FEET]
#
# Pick the element in the guard's menu (sneak + right-click, or /garrison gear): click the
# element button to cycle through. Free, any time, for anyone who manages the town's garrison.
#
# Nothing here ever places or breaks a block: earth and water are particles, sounds and
# floating block displays that are never saved with the world.
# Abilities only ever hit the guard's enemies, and the damage comes from the guard itself,
# so Garrison's friendly-fire, grudge, outlaw and bounty rules all apply.

# Element a newly hired Elementalist starts with: fire, water, earth, air, or random.
default-element: random

# A few particles around each Elementalist showing its element, once a second.
ambient-particles: true

abilities:
  # FIRE: a ranged burst that sets its target alight (the target burns; blocks never do).
  fire-blast:
    damage: 6
    cooldown-seconds: 3
    range: 20
    speed: 1.2
    burn-seconds: 3
  # FIRE: a short cone of flame at enemies close in front.
  heat-wave:
    damage: 4
    cooldown-seconds: 6
    range: 5
    angle: 70
    burn-seconds: 2

  # EARTH: a thrown rock that knocks its target back.
  earth-blast:
    damage: 5
    cooldown-seconds: 4
    range: 16
    speed: 1.0
    knockback: 1.2
  # EARTH: a ground slam that stuns, then slows, every enemy nearby.
  tremor:
    damage: 3
    cooldown-seconds: 8
    radius: 4
    stun-seconds: 1.5
    slow-seconds: 3

  # AIR: a strong push that shoves an enemy away (and out of town, with luck).
  air-blast:
    damage: 2
    cooldown-seconds: 5
    range: 8
    speed: 1.6
    knockback: 2.2
  # AIR: a fast fan of light cuts, for harassing at range.
  air-swipe:
    damage: 2
    cooldown-seconds: 2.5
    range: 14
    speed: 1.8
    streams: 3
    spread: 12

  # WATER: a ranged lash that pulls its target in.
  water-whip:
    damage: 4
    cooldown-seconds: 4
    range: 14
    speed: 1.3
    pull: 0.9
  # WATER: a burst of cold that slows nearby enemies and heals the Elementalist and the
  # town's other guards around it.
  frost:
    damage: 1
    cooldown-seconds: 10
    radius: 6
    slow-seconds: 4
    heal: 3
